name: Regenerate

# Manual only. sky.yml now owns README.md on a daily schedule, and two
# generators writing the same fence would overwrite each other. Restore the
# schedule line to hand it back.
on:
  workflow_dispatch:

jobs:
  update-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: node .github/scripts/cellular.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Regenerate ascii composition"
          file_pattern: "README.md"
