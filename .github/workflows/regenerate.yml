name: Regenerate

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '23'

      - run: node .github/scripts/cellular.ts

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Regenerate ascii composition'
          file_pattern: 'README.md'