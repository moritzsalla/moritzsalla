name: sky

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      # Scheduled workflows in public repos are disabled after 60 days without
      # repository activity, and this one already lost seven months that way.
      # Runs do not count as activity - ten fired during that gap and it still
      # died. Whether the bot's own commits count is untested, so SKY_TOKEN
      # exists to take the guesswork out: with it, the daily push is
      # authenticated as a user rather than as the Actions bot. Without it this
      # falls back to the default token and behaves exactly as before.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SKY_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The parser depends on these field names and they cannot be checked from
      # a sandbox with no route to the API, so the log carries them. Diagnostic
      # only: it has no retries of its own, so a blip here must not fail the job
      # and cost a day the render step would have recovered.
      - name: Probe the API contract
        continue-on-error: true
        run: python scripts/sky.py --probe

      - run: python scripts/sky.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || {
            git add README.md
            git commit -m "sky: $(date -u +%Y-%m-%d)"
            git push
          }
